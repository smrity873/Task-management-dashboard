<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- tailwind css  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font_family  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Style+Script&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-200 max-w-7xl mx-auto  p-6 ">
    <header class="main mb-8 ">
        <!-- header  -->
        <div class="flex justify-between item-center">
            <h1 class="text-xl font-semibold">Dashboard</h1>

            <div class="flex items-center gap-4">

                <button class="p-2 rounded-full  hover:bg-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                    </svg>
                </button>

                <button class="w-10 h-10 bg-blue-600 rounded-full text-white font-semibold">B</button>
            </div>

        </div>
    </header>

    <!-- main section  -->
    <main>
        <div class="total_card grid grid-cols-4 gap-6">

            <!-- 1st card  -->
            <div class="card bg-white shadow-md p-6 rounded-sm">
                <div>

                    <h3 class="text-sm font-medium text-gray-500 pb-2">TOTAL TASK</h3>
                    <div class="flex justify-between">
                        <div>
                            <h2 class="text-bold font-bold text-3xl">3</h2>
                            <p class="text-gray-400 text-sm">111 last month</p>
                        </div>
                        <div class="p-2 rounded-full  bg-blue-100 w-11 h-11">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                class="text-blue-400" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5A3.375 3.375 0 0 0 6.375 7.5H5.25m11.9-3.664A2.251 2.251 0 0 0 15 2.25h-1.5a2.251 2.251 0 0 0-2.15 1.586m5.8 0c.065.21.1.433.1.664v.75h-6V4.5c0-.231.035-.454.1-.664M6.75 7.5H4.875c-.621 0-1.125.504-1.125 1.125v12c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V16.5a9 9 0 0 0-9-9Z" />
                            </svg>

                        </div>
                    </div>


                </div>

            </div>

            <!-- 2nd card  -->
            <div class="card bg-white shadow-md p-6 rounded-sm">
                <div>

                    <h3 class="text-sm font-medium text-gray-500 pb-2">COMPLETED TASK</h3>
                    <div class="flex justify-between">
                        <div>
                            <h2 class="text-bold font-bold text-3xl">3</h2>
                            <p class="text-gray-400 text-sm">111 last month</p>
                        </div>
                        <div class="p-2 rounded-full  bg-green-100 w-11 h-11">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                class="text-green-500" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>


                        </div>
                    </div>


                </div>

            </div>

            <!-- 3rd card  -->
            <div class="card bg-white shadow-md p-6 rounded-sm">
                <div>

                    <h3 class="text-sm font-medium text-gray-500 pb-2">TASK PROGRESS</h3>
                    <div class="flex justify-between">
                        <div>
                            <h2 class="text-bold font-bold text-3xl">3</h2>
                            <p class="text-gray-400 text-sm">111 last month</p>
                        </div>
                        <div class="p-2 rounded-full  bg-yellow-100 w-11 h-11">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                class="text-yellow-500" stroke-width="2" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>


                        </div>
                    </div>


                </div>

            </div>

            <!-- 4th card  -->
            <div class="card bg-white shadow-md p-6 rounded-sm">
                <div>

                    <h3 class="text-sm font-medium text-gray-500 pb-2">TODOS</h3>
                    <div class="flex justify-between">
                        <div>
                            <h2 class="text-bold font-bold text-3xl">3</h2>
                            <p class="text-gray-400 text-sm">111 last month</p>
                        </div>
                        <div class="p-2 item start rounded-full  bg-rose-200 w-11 h-11">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                class="text-rose-500" stroke-width="2" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                            </svg>


                        </div>
                    </div>


                </div>

            </div>
        </div>

    </main>

    <!-- table  -->
    <div>
        <!-- table head  -->
        <div class="bg-white rounded-sm shadow-md mt-8  ">
            <div class="grid grid-cols-4 p-4 border-b border-gray-100 text-sm text-gray-400">

                <div>TASK TITLE</div>
                <div>PRIORITY</div>
                <div>TEAM</div>
                <div>CREATED AT</div>

            </div>

            <!-- task item 1 -->
            <div class="dibide-y divide-gray-500">
                <div class="grid grid-cols-4 p-4 gap-4 items-center ">

                    <div class="flex items-center gap-1">
                        <div class="w-2 h-2 rounded-full bg-green-500 "></div>
                        <div class="text-sm">
                            <span>Text Low Task</span>
                        </div>
                    </div>
                    <div class="px-2  text-sm text-blue-500 rounded-md bg-blue-100 w-10 h-6">
                        <span>Low</span>

                    </div>
                    <div class="flex -space-x-2">
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            CA</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            JS</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            B</div>

                    </div>
                    <div class="text-sm text-gray-400"> 9 months ago</div>

                </div>
            </div>

            <!-- task item 2 -->
            <div class="dibide-y divide-gray-500">
                <div class="grid grid-cols-4 p-4 gap-4 items-center ">

                    <div class="flex items-center gap-1">
                        <div class="w-2 h-2 rounded-full bg-yellow-500 "></div>
                        <div class="text-sm">
                            <span>Text Low Task</span>
                        </div>
                    </div>
                    <div class="px-2  text-sm text-black-500 rounded-md bg-gray-100 w-16 h-6">
                        <span>Normal</span>

                    </div>
                    <div class="flex -space-x-2">
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            AJ</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            EV</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            B</div>

                    </div>
                    <div class="text-sm text-gray-400"> 9 months ago</div>

                </div>
            </div>

            <!-- task item 3-->
            <div class="dibide-y divide-gray-500">
                <div class="grid grid-cols-4 p-4 gap-4 items-center ">

                    <div class="flex items-center gap-1">
                        <div class="w-2 h-2 rounded-full bg-orange-500 "></div>
                        <div class="text-sm">
                            <span>Text Low Task</span>
                        </div>
                    </div>
                    <div class="px-2  text-sm text-red-500 rounded-md bg-red-100 w-11 h-6">
                        <span>High</span>
                    </div>
                    
                    <div class="flex -space-x-2">
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            CA</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            JS</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            AJ</div>
                        <div
                            class="flex w-8 h-8 rounded-full bg-blue-500 items-center justify-center text-white text-sm border-2 border-white ">
                            B</div>

                    </div>
                    <div class="text-sm text-gray-400"> 10 months ago</div>

                </div>
            </div>


        </div>

    </div>

</body>

</html>
